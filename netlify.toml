[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redireciona todas as chamadas /api/* para a Serverless Function do Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Roteamento SPA para o React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
